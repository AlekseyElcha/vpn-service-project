<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Уруру VPN - Подключение</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030305; /* Ещё глубже черный для контраста */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --neon-pink: #ff2a85;
            --neon-blue: #00f0ff;
            --neon-purple: #7c3aed;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 1. Премиальная текстура шума (Noise Texture) */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)"/></svg>');
            opacity: 0.04;
            z-index: -1;
            pointer-events: none;
        }

        /* 2. Кинематографичный медленно вращающийся свет на фоне */
        body::after {
            content: '';
            position: fixed;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: 
                radial-gradient(circle at 40% 40%, rgba(255, 42, 133, 0.22) 0%, transparent 45%),
                radial-gradient(circle at 60% 60%, rgba(0, 240, 255, 0.22) 0%, transparent 45%);
            animation: ambientRotate 30s infinite linear;
            z-index: -2;
            pointer-events: none;
        }

        @keyframes ambientRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .container {
            max-width: 1000px;
            width: 100%;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
            position: relative;
            z-index: 1;
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 52px;
            margin-bottom: 15px;
            display: inline-block;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.2));
            animation: gentleHover 4s ease-in-out infinite;
        }

        @keyframes gentleHover {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); filter: drop-shadow(0 10px 25px rgba(255, 42, 133, 0.4)); }
        }

        h1 {
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 20%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
        }

        .app-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }

        /* 3. Идеальное 3D Стекло (Glassmorphism Pro) */
        .app-card {
            background: rgba(20, 20, 24, 0.55);
            backdrop-filter: blur(30px) saturate(150%);
            -webkit-backdrop-filter: blur(30px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 
                inset 0 1px 0 0 rgba(255, 255, 255, 0.08), /* Блик на верхнем крае стекла */
                0 20px 40px -10px rgba(0, 0, 0, 0.5); /* Глубокая тень */
            border-radius: 24px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .app-card:hover {
            transform: translateY(-4px) scale(1.01);
            background: rgba(30, 30, 36, 0.65);
            box-shadow: 
                inset 0 1px 0 0 rgba(255, 255, 255, 0.15),
                0 30px 50px -15px rgba(0, 0, 0, 0.7),
                0 0 30px rgba(0, 240, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .app-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .app-name {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            letter-spacing: -0.3px;
        }

        .app-desc {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        /* 4. Кнопка "Имба": Бегущий градиент */
        .btn-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-pink), var(--neon-purple), var(--neon-blue));
            background-size: 300% 300%;
            animation: gradientSweep 6s ease infinite;
            color: white;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.3px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border: none;
            cursor: pointer;
            box-shadow: 
                0 4px 15px rgba(255, 42, 133, 0.3), 
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            position: relative;
            z-index: 1;
        }

        @keyframes gradientSweep {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 12px 30px rgba(255, 42, 133, 0.5), 
                0 12px 30px rgba(0, 240, 255, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
            filter: brightness(1.1);
        }

        /* Тот самый мощный подсвет при нажатии */
        .btn-primary:active {
            transform: translateY(2px) scale(0.96);
            box-shadow: 
                0 0 40px 15px rgba(255, 42, 133, 0.8), 
                0 0 40px 15px rgba(0, 240, 255, 0.8),
                inset 0 2px 4px rgba(0, 0, 0, 0.4);
            filter: brightness(1.3);
        }

        .btn-secondary {
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            padding: 8px;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            color: #fff;
            transform: translateY(-1px);
        }
        
        .copy-section {
            margin-top: 50px;
            text-align: center;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .copy-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            padding: 14px 24px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        
        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .copy-btn:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.12);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">🚀</div>
            <h1>Настройка для {{ os_name }}</h1>
            <p class="subtitle">Выберите приложение, которое вы хотите использовать для подключения к Уруру VPN.</p>
        </div>
        
        <div class="app-list">
            {% for app in apps %}
            <div class="app-card">
                <div class="app-info">
                    <div class="app-name">{{ app.name }}</div>
                    <div class="app-desc">{{ app.desc }}</div>
                </div>
                <div class="actions">
                    <a href="{{ app.deep_link|safe }}" class="btn-primary">Настроить в 1 клик</a>
                    <a href="{{ app.store_link }}" target="_blank" class="btn-secondary">Ещё нет приложения? Скачать</a>
                </div>
            </div>
            {% endfor %}
        </div>
        
        <div class="copy-section">
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 10px;">Для ручной настройки:</p>
            <button class="copy-btn" onclick="navigator.clipboard.writeText('{{ sub_link|safe }}'); alert('Ссылка скопирована!');">
                Скопировать обычную ссылку
            </button>
        </div>
    </div>

</body>
</html>
