<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Уруру VPN - Подключение</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, rgba(59, 130, 246, 0.15), transparent 400px),
                              radial-gradient(circle at bottom left, rgba(147, 51, 234, 0.15), transparent 400px);
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.5;
        }

        .app-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .app-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .app-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .app-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .app-name {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }

        .app-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 5px;
        }

        .btn-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--accent);
            color: white;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.39);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            padding: 8px;
            transition: color 0.2s;
        }

        .btn-secondary:hover {
            color: #fff;
        }
        
        .copy-section {
            margin-top: 40px;
            text-align: center;
            padding-top: 30px;
            border-top: 1px solid var(--card-border);
        }
        
        .copy-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        
        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
    </script>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">🚀</div>
            <h1>Настройка для {{ os_name }}</h1>
            <p class="subtitle">Выберите приложение, которое вы хотите использовать для подключения к Уруру VPN.</p>
        </div>
        
        <div class="app-list">
            {% for app in apps %}
            <div class="app-card">
                <div class="app-info">
                    <div class="app-name">{{ app.name }}</div>
                    <div class="app-desc">{{ app.desc }}</div>
                </div>
                <div class="actions">
                    <a href="{{ app.deep_link|safe }}" class="btn-primary">Настроить в 1 клик</a>
                    <a href="{{ app.store_link }}" target="_blank" class="btn-secondary">Ещё нет приложения? Скачать</a>
                </div>
            </div>
            {% endfor %}
        </div>
        
        <div class="copy-section">
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 10px;">Для ручной настройки:</p>
            <button class="copy-btn" onclick="navigator.clipboard.writeText('{{ sub_link|safe }}'); alert('Ссылка скопирована!');">
                Скопировать обычную ссылку
            </button>
        </div>
    </div>

</body>
</html>
